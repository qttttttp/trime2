# 拉取上游主仓库最新代码 → 应用 patches/ 下的补丁 → 用 trime2-100y 签名编译
name: Build Patched

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "上游分支或标签"
        required: false
        default: "develop"
  push:
    branches:
      - develop
      - master
      - main
    paths:
      - "patches/**"
      - "signing/**"
      - ".github/workflows/build-patched.yml"
      # 离线 AAR 生成工具变了要重新构建
      - "tools/**"
  schedule:
    # 每天 UTC 18:00 (北京时间 02:00) 跟随上游自动构建
    # 定时触发会先比对上游提交,与上次构建记录相同则跳过(见 check job)
    - cron: "0 18 * * *"

permissions:
  contents: write

env:
  UPSTREAM_REPO: nirenr/trime2
  UPSTREAM_REF: ${{ github.event.inputs.upstream_ref || 'develop' }}

jobs:
  # 定时触发时先看上游有没有新提交,没有就不浪费一次完整构建
  check:
    runs-on: ubuntu-24.04
    outputs:
      skip: ${{ steps.compare.outputs.skip }}
    steps:
      - name: 比对上游提交
        id: compare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 只对 schedule 做短路:手动触发和 push 一律构建
          if [ "${GITHUB_EVENT_NAME}" != "schedule" ]; then
            echo "触发方式为 ${GITHUB_EVENT_NAME},直接构建"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 网络抖动时保守处理:拿不到上游 SHA 就照常构建
          SHA=$(git ls-remote "https://github.com/${UPSTREAM_REPO}.git" \
                  "refs/heads/${UPSTREAM_REF}" 2>/dev/null | cut -f1 || true)
          if [ -z "$SHA" ]; then
            echo "::warning::无法获取上游 HEAD,继续构建"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "上游 ${UPSTREAM_REPO}@${UPSTREAM_REF} HEAD = ${SHA}"
          # 上次成功构建的上游提交写在 patched-latest 的 Release 说明里
          LAST=$(gh release view patched-latest --repo "${GITHUB_REPOSITORY}" \
                   --json body -q .body 2>/dev/null \
                 | sed -n 's/.*upstream-sha: *\([0-9a-f]\{40\}\).*/\1/p' \
                 | head -1 || true)
          echo "上次构建记录 = ${LAST:-<无>}"
          if [ -n "$LAST" ] && [ "$SHA" = "$LAST" ]; then
            echo "上游无新提交,跳过本次构建"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            {
              echo "### 上游无新提交,跳过构建"
              echo ""
              echo "- 上游: \`${UPSTREAM_REPO}@${UPSTREAM_REF}\`"
              echo "- 提交: \`${SHA}\`"
              echo "- 与 \`patched-latest\` 记录的上次构建一致"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "上游有更新或首次构建,开始构建"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    # 上游没变时整个 build job 跳过(手动触发/push 不受影响)
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    # 串行化:避免两次构建同时向 patched-latest 上传资产产生冲突
    concurrency:
      group: build-patched
      cancel-in-progress: false
    steps:
      - name: Checkout 本仓库
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 配置 git 身份
        run: |
          # 构建脚本会读取 git config user.name / remote,缺失会导致 gradle 配置阶段失败
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: 同步上游主仓库
        run: |
          set -e
          # 网络抖动重试:失败后 10/20 秒再试,最多 4 次
          retry() {
            local n=0
            until "$@"; do
              n=$((n+1))
              if [ $n -ge 4 ]; then echo "命令重试 4 次仍失败"; return 1; fi
              echo "命令失败,$((n*10)) 秒后第 $n 次重试..."
              sleep $((n*10))
            done
          }
          # 主仓库自身构建时无需同步
          if [ "${{ github.repository }}" = "$UPSTREAM_REPO" ]; then
            echo "当前仓库即主仓库,跳过同步"
            echo "UPSTREAM_SHA=${GITHUB_SHA}" >> "$GITHUB_ENV"
            exit 0
          fi
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git" 2>/dev/null \
            || git remote set-url upstream "https://github.com/${UPSTREAM_REPO}.git"
          retry git fetch --depth=1 upstream "${UPSTREAM_REF}"
          # 以主仓库代码为基线(丢弃 fork 里的源码差异,补丁另行应用)
          git reset --hard FETCH_HEAD
          # 记录实际构建的上游提交,发布时写入 Release 说明供下次比对
          echo "UPSTREAM_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "基线: $(git log --oneline -1)"
          # 恢复本仓库独有的文件(README 也是 fork 自己的,不在恢复名单会被上游覆盖)
          # ML Kit 离线 AAR 不再入库:构建时由 tools/make-offline-aar.py 现场生成
          # (模型也不打包进 APK,4 个模型 zip 由用户放到 lua 脚本目录)
          for p in patches signing tools README.md .github/workflows/build-patched.yml; do
            git checkout "$GITHUB_SHA" -- "$p" 2>/dev/null || echo "跳过恢复 $p (仓库中不存在)"
          done
          git status --short | head -20

      - name: 应用补丁
        run: |
          set -e
          shopt -s nullglob
          found=0
          for p in patches/*.patch; do
            name=$(basename "$p")
            case "$name" in
              # 安卓 9 专用补丁不参与构建(与新版字体链冲突)
              *android9*|*安卓9*)
                echo "跳过 $name (安卓 9 专用)"
                continue
                ;;
            esac
            found=1
            echo "::group::应用 $name"
            if ! git apply -v "$p"; then
              echo "git apply 失败,尝试三方合并"
              if ! git apply --3way "$p"; then
                echo "三方合并失败,尝试 patch --fuzz"
                patch -p1 --fuzz=3 --forward < "$p"
              fi
            fi
            echo "::endgroup::"
          done
          if [ $found -eq 0 ]; then
            echo "::warning::patches/ 下没有找到可应用的补丁"
          fi
          git status --short | head -30

      - name: 补丁落地自检（每个补丁必须真正生效）
        run: |
          set -e
          # 1) 不允许出现被拒绝的 hunk 残留（patch --fuzz 失败时会留 .rej）
          REJ=$(find . -path ./.git -prune -o \( -name '*.rej' -o -name '*.orig' \) -print)
          if [ -n "$REJ" ]; then
            echo "::error::存在 .rej/.orig，补丁未干净应用"
            echo "$REJ"
            exit 1
          fi
          # 2) 抽查每个补丁的标志物，防止「apply 报成功但内容没进去」
          check() {
            local file="$1" needle="$2" label="$3"
            if ! grep -qF "$needle" "$file"; then
              echo "::error::$label 未生效：$file 中找不到 '$needle'"
              exit 1
            fi
            echo "OK: $label"
          }
          check app/src/main/jni/cmake/Boost.cmake "vmd" "07 boost vmd"
          check build-logic/convention/src/main/kotlin/OpenCCDataPlugin.kt \
                "Skip missing OpenCC dictionary" "08 opencc 缺字典跳过"
          check app/src/main/java/com/osfans/trime/TrimeService.java \
                "MlkitModelInstaller" "06 mlkit installer"
          check app/proguard-rules.pro "mlkit_vision_digital_ink" "06 proguard keep"
          check app/src/main/java/com/androlua/Http.java "putFile" "04 http 流式上传"
          check app/src/main/jni/CMakeLists.txt "_FILE_OFFSET_BITS=0" "05 file offset 兼容"

      - name: 生成 ML Kit 离线 AAR（本地 127.0.0.1 优先，在线 https 兜底）
        run: |
          set -e
          # 从 Google Maven 拉原版 AAR（Apache-2.0 公开依赖），sha1 校验防供应链篡改
          # 注意文件名必须是 digital-ink-recognition-19.0.0.aar：
          # make-offline-aar.py 按「输入文件名 + -offline」命名输出 AAR，
          # 后面的断言和 cp 步骤都按 digital-ink-recognition-19.0.0-offline.aar 找文件
          curl -fsSL -o digital-ink-recognition-19.0.0.aar \
            https://dl.google.com/android/maven2/com/google/mlkit/digital-ink-recognition/19.0.0/digital-ink-recognition-19.0.0.aar
          echo "2f4ebc121902df17a0304a6d1ac576dc8a60d9b0  digital-ink-recognition-19.0.0.aar" | sha1sum -c -
          # 改写 manifest：双地址模式 —— 127.0.0.1:18080 优先，官方 https 兜底
          # 本地有 zip 就走回环（毫秒级、不碰网络）；本地 404 才由下载器改试 Google。
          # dl.google.com 在国内时通时不通，所以不能把在线放第一条。
          # 仓库中不存放 AAR，构建期现场生成
          python3 tools/make-offline-aar.py \
            --aar digital-ink-recognition-19.0.0.aar \
            --pkg com.nirenr.trime \
            --langs zh-Hani,zh-Hani-CN \
            --url-prefix "http://127.0.0.1:18080" \
            --local-first \
            --out ./offline-aar
          # 断言改写成功（防止静默产出地址没改的坏 AAR，到设备上才暴露）
          python3 - <<'PYEOF'
          import zipfile, json
          with zipfile.ZipFile("offline-aar/digital-ink-recognition-19.0.0-offline.aar") as z:
              m = json.loads(z.read("assets/manifest.json"))
          both = [p for p in m["packs"]
                  if any("127.0.0.1" in u for u in p.get("download_urls", []))]
          assert len(both) == 4, "双地址 pack 数应为 4，实际 %d" % len(both)
          for p in both:
              us = p["download_urls"]
              assert len(us) == 2, "%s 地址数应为 2，实际 %d" % (p["name"], len(us))
              assert "127.0.0.1:18080" in us[0], "%s 第一条不是本地服务" % p["name"]
              assert us[1].startswith("https://dl.google.com/"), "%s 第二条不是官方 https" % p["name"]
          print("OK: 4 个 pack 均为 [本地 127.0.0.1, 官方 https]")
          PYEOF
          mkdir -p app/libs
          cp -f offline-aar/digital-ink-recognition-19.0.0-offline.aar app/libs/
          # 模型不进包：APK 只带 AAR 与 installer 逻辑，4 个 zip 由使用者放到
          # 手写面板脚本所在目录（本地模型服务根目录就是脚本目录）。
          # assets/mlkit-offline 留空时，MlkitModelInstaller 静默跳过，不报错。
          rm -rf app/src/main/assets/mlkit-offline
          mkdir -p app/src/main/assets/mlkit-offline

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          # 与定版构建环境一致（定版在 JDK 20 下编译并通过真机验证）
          java-version: 20
          cache: "gradle"

      - name: 安装 SDK 组件
        run: |
          # GitHub runner 镜像已预装 Android SDK(ANDROID_HOME 已设置),
          # 不需要 android-actions/setup-android(其内部的 sdkmanager tools 在
          # 新镜像 cmdline-tools 16.0 上已失效:Failed to find package 'tools')
          retry() {
            local n=0
            until "$@"; do
              n=$((n+1))
              if [ $n -ge 4 ]; then echo "命令重试 4 次仍失败"; return 1; fi
              echo "命令失败,$((n*10)) 秒后第 $n 次重试..."
              sleep $((n*10))
            done
          }
          # runner 镜像的 cmdline-tools 目录名是版本号(如 16.0),不在 PATH 里,
          # 自动定位 sdkmanager 可执行文件
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          retry "$SDKMANAGER" --install "cmake;3.31.6"

      - name: 配置签名与构建参数
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          set -e
          KEYSTORE="$GITHUB_WORKSPACE/trime2-100y.keystore"
          if [ -f "signing/trime2-100y.keystore" ]; then
            cp "signing/trime2-100y.keystore" "$KEYSTORE"
            echo "使用仓库内 signing/trime2-100y.keystore"
          elif [ -n "$SIGNING_KEY" ]; then
            echo "$SIGNING_KEY" | base64 -d > "$KEYSTORE"
            echo "使用 secret SIGNING_KEY 解码的 keystore"
          else
            echo "::error::未找到签名文件:请提交 signing/trime2-100y.keystore 或配置 secret SIGNING_KEY"
            exit 1
          fi

          printf '%s\n' \
            'org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8' \
            'org.gradle.parallel=true' \
            'org.gradle.caching=true' \
            'android.useAndroidX=true' \
            'API_KEY=""' \
            'API_ID=""' \
            "signKeyFile=$KEYSTORE" \
            "signKeyStorePwd=${{ secrets.KEY_STORE_PASSWORD }}" \
            "signKeyAlias=${{ secrets.ALIAS }}" \
            "signKeyPwd=${{ secrets.KEY_PASSWORD }}" \
            > gradle.properties
          cat gradle.properties

          # 校验签名配置能被 gradle 读到
          keytool -list -keystore "$KEYSTORE" \
            -storepass "${{ secrets.KEY_STORE_PASSWORD }}" \
            -alias "${{ secrets.ALIAS }}" | tail -3

      - name: 拉取子模块
        run: |
          retry() {
            local n=0
            until "$@"; do
              n=$((n+1))
              if [ $n -ge 4 ]; then echo "命令重试 4 次仍失败"; return 1; fi
              echo "命令失败,$((n*10)) 秒后第 $n 次重试..."
              sleep $((n*10))
            done
          }
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule sync --recursive
          retry git submodule update --init --recursive

          # 锁定到定版（唯一真机验证可下载模型）编译时使用的子模块版本。
          # 上游 0.8.5 的 gitlink 更旧,librime_jni.so / opencc 数据 / 词典都会不同。
          pin() {
            local path="$1" sha="$2"
            git -C "$path" checkout -q "$sha" 2>/dev/null || {
              git -C "$path" fetch -q origin
              git -C "$path" checkout -q "$sha"
            }
            test "$(git -C "$path" rev-parse HEAD)" = "$sha" \
              || { echo "::error::子模块 $path 无法锁定到 $sha"; exit 1; }
            echo "锁定 $path -> ${sha:0:7}"
          }
          pin app/src/main/jni/librime           56737cd29a4d393a104a2098ece3697aa2810465
          pin app/src/main/jni/OpenCC            025f371dc76b598d77384fbdab90c937471844d8
          pin app/src/main/jni/librime-octagram  57d18b9f58e5284bd891d559f6bdd16cf60341e9
          pin app/src/main/jni/librime-predict   920bd41ebf6f9bf6855d14fbe80212e54e749791
          pin app/src/main/jni/snappy            946606459314e55d029c85f9a8c46f8809467f0f
          pin app/src/main/jni/librime-lua       6da5d6cedb853380ed1b5b9b6979cb1a9c028353
          pin app/src/main/jni/librime-lua-deps  9e5bb71db1544913f8005dadc3df8439c00d08b7
          pin app/data/rime/essay                054920de4f54c9e5994276a96a4fc2a35cb51aa3

      - name: 计算 JNI 缓存 key
        id: cache-hash
        run: |
          ./gradlew :app:calculateNativeCacheHash

      - name: 复用 JNI 编译缓存
        uses: actions/cache@v4
        id: jni-cache
        with:
          path: "app/prebuilt"
          # v2：子模块已锁定到定版版本,旧缓存里的 .so 是别的子模块编出来的,必须弃用
          key: ${{ runner.os }}-trime-jni-patched-v2-${{ steps.cache-hash.outputs.native-cache-hash }}

      - name: 构建 Release APK
        run: |
          # 依赖下载偶发超时,失败后复用缓存重跑一次
          ./gradlew :app:assembleRelease --no-daemon --stacktrace \
            || { echo "首次构建失败,60 秒后重试一次"; sleep 60; ./gradlew :app:assembleRelease --no-daemon --stacktrace; }

      - name: 回写 JNI 缓存
        if: ${{ !steps.jni-cache.outputs.cache-hit }}
        run: cp -R app/build/intermediates/merged_native_libs/release/mergeReleaseNativeLibs/out/lib app/prebuilt

      - name: 修正 ML Kit https 校验分支并重签
        run: |
          set -e
          APK=$(ls app/build/outputs/apk/release/*arm64-v8a*.apk | head -1)
          chmod +x tools/postprocess-apk.sh tools/patch-dex-https.py
          bash tools/postprocess-apk.sh "$APK" \
            "$GITHUB_WORKSPACE/trime2-100y.keystore" \
            "${{ secrets.KEY_STORE_PASSWORD }}" \
            "${{ secrets.ALIAS }}" \
            "${{ secrets.KEY_PASSWORD }}"

      - name: 校验签名
        run: |
          APK=$(ls app/build/outputs/apk/release/*arm64-v8a*.apk | head -1)
          echo "APK: $APK"
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | head -6

      - name: 产物自检（只查功能必需项，不追定版字节）
        run: |
          APK=$(ls app/build/outputs/apk/release/*arm64-v8a*.apk | head -1)
          echo "=== 关键条目 ==="
          unzip -l "$APK" | grep -E "librime_jni\.so|libdigitalink\.so|assets/manifest\.json" \
            | awk '{printf "  %10d  %s\n", $1, $4}'
          # 模型必须不在包里：出现任一 assets/mlkit-offline/*.zip 就是打包逻辑跑偏了
          PACKED=$(unzip -l "$APK" | grep -c 'assets/mlkit-offline/.*\.zip')
          SIZE_MB=$(( $(stat -c%s "$APK") / 1048576 ))
          echo "  APK 体积 ${SIZE_MB} MB，包内模型 zip ${PACKED} 个"
          if [ "$PACKED" -ne 0 ]; then
            echo "::error::APK 里打进了 $PACKED 个模型 zip，模型应只随脚本目录分发"
            unzip -l "$APK" | grep 'assets/mlkit-offline/' | awk '{print "    " $1, $4}'
            exit 1
          fi
          if [ "$SIZE_MB" -gt 40 ]; then
            echo "::warning::APK ${SIZE_MB} MB 偏大，确认没有别的资源被误打包"
          fi
          OPENCC_N=$(unzip -l "$APK" | grep -c 'assets/shared/opencc/')
          echo "  shared/opencc 条目数  $OPENCC_N"
          # 定版 30 条目里含 s2seal/t2seal/seal2t 三个文言配置，
          # 而 pin 的 OpenCC(025f371) 的 data/config 已不含它们——定版那 3 个是旧构建残留。
          # 所以这里只判「任务是否真的跑过」，不拿 30 当基准。
          if [ "$OPENCC_N" -lt 24 ]; then
            echo "::error::opencc 条目数 $OPENCC_N 明显偏少，installOpenCCData 可能没跑或 08 补丁未生效"
            unzip -l "$APK" | grep 'assets/shared/opencc/' | awk '{print "    " $4}'
            exit 1
          fi
          if ! unzip -l "$APK" | grep -q 'shared/opencc/JPShinjitaiCharacters.txt'; then
            echo "::error::opencc 缺少 JPShinjitaiCharacters.txt，08 补丁的字典映射未生效"
            exit 1
          fi
          if ! unzip -l "$APK" | grep -q 'shared/opencc/t2s.json'; then
            echo "::error::opencc 缺少 t2s.json，配置拷贝环节异常"
            exit 1
          fi
          echo "::notice::librime_jni.so 大小仅记录不比较：子模块已 pin 一致，剩余差异来自 CI 工具链，与下载链路无关"
          echo "=== manifest 地址自检（4 个 pack × [本地, 官方 https]）==="
          APK="$APK" python3 - <<'PYEOF'
          import zipfile, json, os, sys
          apk = os.environ["APK"]
          with zipfile.ZipFile(apk) as z:
              m = json.loads(z.read("assets/manifest.json"))
          both = [p for p in m["packs"]
                  if any("127.0.0.1" in u for u in p.get("download_urls", []))]
          bad = [p["name"] for p in both
                 if len(p["download_urls"]) != 2
                 or "127.0.0.1:18080" not in p["download_urls"][0]
                 or not p["download_urls"][1].startswith("https://dl.google.com/")]
          if len(both) != 4 or bad:
              sys.exit("地址结构异常: pack 数=%d, 不合格=%s" % (len(both), bad))
          for p in both:
              print("  %-52s local + https" % p["name"])
          PYEOF
          echo "=== https 校验分支状态（必须是 goto，否则构建失败）==="
          DEXDUMP=$(ls -d "$ANDROID_HOME"/build-tools/*/dexdump | sort -V | tail -1)
          unzip -p "$APK" classes.dex > /tmp/check.dex
          "$DEXDUMP" -d /tmp/check.dex 2>/dev/null | grep -B3 "is not secure" | head -4
          if ! "$DEXDUMP" -d /tmp/check.dex 2>/dev/null | grep -B3 "is not secure" | grep -q "goto"; then
            echo "::error::https 校验分支未被修正为 goto，此包无法下载本地模型"
            exit 1
          fi

      - name: 上传 APK
        uses: actions/upload-artifact@v5
        with:
          name: trime-patched-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 90

      # 非 tag 构建统一发到固定 tag 的 rolling Release:
      # 链接永久固定、公开仓库任何人无需登录即可下载、不受 artifact 90 天过期影响
      - name: 发布到 patched-latest
        if: startsWith(github.ref, 'refs/tags/') == false
        uses: softprops/action-gh-release@v2
        with:
          tag_name: patched-latest
          name: "跟随上游最新构建"
          body: |
            上游基线: ${{ env.UPSTREAM_REPO }}@${{ env.UPSTREAM_REF }}
            upstream-sha: ${{ env.UPSTREAM_SHA }}
            补丁构建: run #${{ github.run_number }}
            本仓库提交: ${{ github.sha }}
          files: app/build/outputs/apk/release/*.apk
          prerelease: true
          make_latest: false

      - name: 发布 Release(打 tag 时)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
