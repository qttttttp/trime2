name: Build Patched Trime2 Release【修复签名配置找不到】
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout self repo (patches)
        uses: actions/checkout@v5
        with:
          path: self
        timeout-minutes: 10

      - name: Checkout upstream trime2
        uses: actions/checkout@v5
        with:
          repository: nirenr/trime2
          ref: develop
          submodules: recursive
          fetch-depth: 0
          path: trime_src
        timeout-minutes: 15

      - name: Apply all patches automatically
        run: |
          cd trime_src
          for p in $(ls -1 ../self/patches/*.patch | sort); do
            echo "===== Applying patch: $p ====="
            git apply --verbose "$p"
            echo "OK: $p"
          done
          git config user.name "ci-bot"
          git config user.email "ci@local.local"
          git add .
          git commit -m "apply custom patches" || true

      - name: Setup JDK 17 Temurin
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Restore keystore file
        run: |
          cd trime_src
          echo "${{ secrets.SIGNING_KEY }}" | base64 -d > release.keystore

      - name: Build assembleRelease
        run: |
          cd trime_src
          ./gradlew assembleRelease \
            -Pbuilder=ci-patched \
            -PbuildCommitHash=patched-ci \
            -PbuildGitRepo=local-ci \
            -PbuildVersionName=0.0.0-patched \
            -PAPI_KEY="" \
            -PAPI_ID="" \
            -PsignKeyFile=release.keystore \
            -PsignKeyStorePwd="${{ secrets.KEY_STORE_PASSWORD }}" \
            -PsignKeyAlias="${{ secrets.ALIAS }}" \
            -PsignKeyPwd="${{ secrets.KEY_PASSWORD }}"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: trime2-signed-release
          path: trime_src/**/build/outputs/apk/release/*.apk
