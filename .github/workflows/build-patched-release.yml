name: Build Patched Trime2 Release
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # 拉取你fork仓库（存放补丁）
      - name: Checkout self repo (patches)
        uses: actions/checkout@v5
        with:
          path: self
        timeout-minutes: 10

      # 拉取上游 nirenr/trime2 develop 分支，带子模块，和上游一致
      - name: Checkout upstream trime2
        uses: actions/checkout@v5
        with:
          repository: nirenr/trime2
          ref: develop
          submodules: recursive
          fetch-depth: 0
          path: trime_src
        timeout-minutes: 15

      # 自动按文件名排序遍历全部 .patch，001、002 顺序
      - name: Apply all patches automatically
        run: |
          cd trime_src
          for p in $(ls -1 ../self/patches/*.patch | sort); do
            echo "===== Applying patch: $p ====="
            git apply --verbose "$p"
            echo "OK: $p"
          done
          # 关键修复：把改动加入git索引，消除git dirty状态
          git add .

      # JDK 17，上游原版配置
      - name: Setup JDK 17 Temurin
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # 写入签名配置，和上游release-ci逻辑完全一致
      - name: Prepare keystore config
        run: |
          cd trime_src
          echo "${{ secrets.SIGNING_KEY }}" | base64 -d > release.keystore
          cat > keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=${{ secrets.KEY_STORE_PASSWORD }}
          keyAlias=${{ secrets.ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      # 核心：直接调用上游原生 make release
      - name: Run make release (original build flow)
        run: |
          cd trime_src
          make release

      # 上传签名release包
      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: trime2-signed-release
          path: trime_src/**/build/outputs/apk/release/*.apk
