name: Build Patched Trime2 Release（自动遍历补丁+自有签名）
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout self repo
        uses: actions/checkout@v5
        with:
          path: self
        timeout-minutes: 10

      - name: Checkout upstream trime2
        uses: actions/checkout@v5
        with:
          repository: nirenr/trime2
          ref: develop
          submodules: recursive
          fetch-depth: 0
          path: trime_src
        timeout-minutes: 15

      - name: Apply patches automatically (sorted by filename)
        run: |
          cd trime_src
          for p in $(ls -1 ../self/patches/*.patch | sort); do
            echo "====================================="
            echo "Applying patch: $p"
            git apply --verbose "$p"
            echo "Patch $p applied OK"
          done

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # 去掉了 setup-android@v3！使用runner自带sdkmanager
      - name: Accept SDK license && install cmake
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "cmake;3.31.6"

      - name: Restore keystore from base64 secret
        run: |
          cd trime_src
          echo "${{ secrets.SIGNING_KEY }}" | base64 -d > release.keystore
          cat > keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=${{ secrets.KEY_STORE_PASSWORD }}
          keyAlias=${{ secrets.ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build release APK
        run: |
          cd trime_src
          make release

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: trime2-signed-release
          path: trime_src/**/build/outputs/apk/release/*.apk
